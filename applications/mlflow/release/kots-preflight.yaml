apiVersion: troubleshoot.sh/v1beta2
kind: Preflight
metadata:
  name: mlflow
spec:
  analyzers:
    - clusterVersion:
        outcomes:
          - fail:
              when: "< 1.21.0"
              message: The application requires at Kubernetes 1.21.0 or later, and recommends 1.28.0.
              uri: https://www.kubernetes.io
          - warn:
              when: "< 1.28.0"
              message: Your cluster meets the minimum version of Kubernetes, but we recommend you update to 1.28.0 or later.
              uri: https://kubernetes.io
          - pass:
              message: Your cluster meets the recommended and required versions of Kubernetes.
    - nodeResources:
        checkName: Total CPU Cores in the cluster is 2 or greater
        outcomes:
          - fail:
              when: "sum(cpuCapacity) < 2"
              message: The cluster must contain at least 2 cores
          - fail:
              when: "sum(cpuCapacity) < 4"
              message: The cluster must contain at least 4 cores
          - pass:
              message: There are at least 2 cores in the cluster
    - storageClass:
        checkName: Check for default storage class
        outcomes:
          - fail:
              message: No default storage class found
          - pass:
              message: Default storage class found
    - customResourceDefinition:
        checkName: Velero is installed for snapshot support
        customResourceDefinitionName: backups.velero.io
        outcomes:
          - warn:
              when: "< 1"
              message: >-
                Velero is not installed. KOTS snapshots for backup and restore
                of PostgreSQL and MinIO data volumes will not be available.
                Install Velero with a compatible storage provider to enable snapshots.
          - pass:
              when: ">= 1"
              message: Velero is installed and available for KOTS snapshots.
